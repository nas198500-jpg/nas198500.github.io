<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google 스타일 홈</title>
    <!-- 외부 CSS 파일 연결 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 상단: 서울, 제주 날씨 -->
    <header>
        <div class="weather-box">
            <div class="weather-item">서울: <span id="seoul-weather">불러오는 중...</span></div>
            <div class="weather-item">|</div>
            <div class="weather-item">제주: <span id="jeju-weather">불러오는 중...</span></div>
        </div>
    </header>

    <!-- 중앙: 구글 스타일 로고 및 검색창 -->
    <main>
        <div class="logo">
            <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
        </div>
        <form class="search-form" action="https://www.google.com/search" method="GET">
            <div class="search-input-wrapper">
                <svg class="search-icon" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path>
                </svg>
                <input type="text" name="q" class="search-input" placeholder="Google 검색 또는 URL 입력" autocomplete="off" autofocus>
            </div>
        </form>
    </main>

    <!-- 하단: 오늘의 명언 -->
    <footer>
        <div class="quote-container">
            <p class="quote-text" id="quote-content">"삶이 있는 한 희망은 있다."</p>
            <p class="quote-author" id="quote-author">- 키케로</p>
        </div>
    </footer>

    <!-- 외부 JavaScript 파일 연결 -->
    <script src="script.js"></script>
</body>
</html>
